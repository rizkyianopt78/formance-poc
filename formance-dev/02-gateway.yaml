apiVersion: v1
kind: ConfigMap
metadata:
  name: caddy-config
  namespace: nw-dev
data:
  Caddyfile: |
    (cors) {
      header {
        Access-Control-Allow-Methods "GET,OPTIONS,PUT,POST,DELETE,HEAD,PATCH"
        Access-Control-Allow-Headers content-type
        Access-Control-Max-Age 100
        Access-Control-Allow-Origin *
        defer
      }
    }

    (handle_path_route_without_auth) {
      # handle_path automatically strips the prefix from the request path
      handle_path {args.0}* {
        reverse_proxy {args.1}

        import cors

      }
    }

    {
      order versions after metrics

      debug
    }

    :8080 {
      import handle_path_route_without_auth "/api/ledger" "formance-ledger:3068"
      import handle_path_route_without_auth "/api/payments" "formance-payments:8080"
      import handle_path_route_without_auth "/api/reconciliation" "formance-reconciliation:8080"

      # auth
      import handle_path_route_without_auth "/api/auth" "formance-auth:8080"

      # flows/orchestration
      import handle_path_route_without_auth "/api/orchestration" "formance-flows:8080"
      import handle_path_route_without_auth "/api/flows" "formance-flows:8080"

      # wallets
      import handle_path_route_without_auth "/api/wallets" "formance-wallets:8080"

      handle /versions {
        versions {
          region "local"
          env "local"
          endpoints {
            ledger http://formance-ledger.nw-dev.svc.cluster.local:3068/v2/_info http://formance-ledger.nw-dev.svc.cluster.local:3068/_healthcheck
            # payments http://formance-payments.nw-dev.svc.cluster.local:8080/_info http://formance-payments.nw-dev.svc.cluster.local:8080/_healthcheck
            # reconciliation http://formance-reconciliation.nw-dev.svc.cluster.local:8080/_info http://formance-reconciliation.nw-dev.svc.cluster.local:8080/_healthcheck
            wallets http://formance-wallets.nw-dev.svc.cluster.local:8080/_info http://formance-wallets.nw-dev.svc.cluster.local:8080/_healthcheck
            # auth http://formance-auth.nw-dev.svc.cluster.local:8080/_info http://formance-auth.nw-dev.svc.cluster.local:8080/_healthcheck
            # orchestration http://formance-flows.nw-dev.svc.cluster.local:8080/_info http://formance-flows.nw-dev.svc.cluster.local:8080/_healthcheck
          }
        }
      }

      # handle all other requests
      handle {
        respond "Bad Gateway" 502
      }

    }

    localhost:8443, formance-gateway-svc:8443 {
      import handle_path_route_without_auth "/api/ledger" "formance-ledger:3068"

      handle /versions {
        versions {
          region "local"
          env "local"
          endpoints {
            ledger /api/ledger/_info /api/ledger/_healthcheck
          }
        }
      }

      # handle all other requests
      handle {
        respond "Bad Gateway" 502
      }
      tls internal
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: formance-gateway
  namespace: nw-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: formance-gateway
  template:
    metadata:
      labels:
        app: formance-gateway
    spec:
      hostAliases:
        - ip: "10.43.208.33"
          hostnames:
            - "formance.internal"
      containers:
        - name: formance-gateway
          image: ghcr.io/formancehq/gateway:v2.0.31
          ports:
            - containerPort: 8080
            - containerPort: 8443
          volumeMounts:
            - name: caddyfile
              mountPath: /etc/caddy/Caddyfile
              subPath: Caddyfile
      volumes:
        - name: caddyfile
          configMap:
            name: caddy-config

---
apiVersion: v1
kind: Service
metadata:
  name: formance-gateway-svc
  namespace: nw-dev
spec:
  selector:
    app: formance-gateway
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 8080
